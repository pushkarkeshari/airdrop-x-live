<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirDrop-X</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background-color: #0056b3; }
        #connectBtn { background-color: #28a745; } 
        #connectBtn:hover { background-color: #218838; }
        #status { margin-top: 15px; font-weight: bold; color: green; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 AirDrop-X (LAN File Drop)</h2>
        <p>Select a file to share with your peers</p>
        
        <input type="file" id="fileInput" />
        <button id="connectBtn">🔌 Connect</button>
        <button id="sendBtn">Send File</button>

        <p id="status">Not connected yet...</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
